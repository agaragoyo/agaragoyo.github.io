# main에 합쳐질 때마다 GitHub Pages로 배포한다.
# 올리기 직전에 tools/stamp.py로 index.html의 JS, CSS 주소에 내용 지문(?v=)을 붙인다.
# 그래서 팀원은 커밋할 때 stamp.py를 따로 돌리지 않아도 된다(known-issues 15).
# 레포 설정의 Pages > Source를 "GitHub Actions"로 두어야 동작한다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/stamp.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
