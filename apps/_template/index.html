<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 앱</title>
  <!--
    새 앱의 틀. 이 폴더를 통째로 복사해서 apps/<내 앱 id>/ 로 이름을 바꾸고 시작한다(id는 영어 소문자와 하이픈).
    _ 로 시작하는 폴더는 틀이라 화면에 나오지 않는다. 자세한 설명은 apps/README.md.
    이 틀은 "점을 누르면 점수가 오르는" 아주 작은 게임이다. 그리기, 입력, 기록 저장, 창 닫기가 다 들어 있으니 필요한 부분만 바꾼다.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    /* 스크롤바가 생겼다 사라지며 화면이 떨리는 일을 막는다(known-issues 14). 지우지 않는다. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #2f3a4a;
      font-family: "Galmuri11", system-ui, sans-serif;
      color: #f7f3e8;
      user-select: none;
    }
    /* 머리줄은 한 줄을 지킨다(두 줄이 되면 아래 게임판이 밀린다, known-issues 12). */
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; white-space: nowrap; overflow: hidden; background: #222b38; font-size: 14px; }
    header .grow { flex: 1; }
    /* 손가락 커서는 아가라고요 창 안에서는 그 시대 모양, 혼자 열면 기본 pointer 가 나온다. */
    button { font: inherit; font-size: 13px; padding: 4px 10px; cursor: var(--aga-hand, pointer); }
    #wrap { flex: 1; display: grid; place-items: center; min-height: 0; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <span>점수 <b id="score">0</b></span>
    <span>최고 <b id="best">0</b></span>
    <span class="grow"></span>
    <button id="restart">다시</button>
    <button id="quit">끝내기</button>
  </header>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <script src="../aga-sdk.js"></script>
  <script>
    // ---------- 게임판 ----------
    // 그리기는 늘 W×H 게임 단위로 한다. 창 크기가 바뀌어도 SDK가 맞춰 준다.
    const W = 480;
    const H = 360;
    const $ = id => document.getElementById(id);
    const cv = $('cv');
    const ctx = cv.getContext('2d');
    const board = AGA.fitCanvas(cv, $('wrap'), W, H);

    // ---------- 기록 ----------
    // AGA.save('best', 값) 은 localStorage 'my-app.best' 처럼 내 앱 id를 앞에 붙여 저장한다.
    let best = AGA.load('best', 0);
    $('best').textContent = best;

    // ---------- 상태 ----------
    let score, dot;
    function reset() {
      score = 0;
      $('score').textContent = score;
      moveDot();
    }
    function moveDot() {
      dot = { x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80), r: 22 };
    }

    // ---------- 입력 ----------
    cv.addEventListener('pointerdown', e => {
      const p = board.point(e); // 마우스 위치를 게임 단위로
      if (Math.hypot(p.x - dot.x, p.y - dot.y) > dot.r) return;
      score += 1;
      $('score').textContent = score;
      if (score > best) {
        best = score;
        $('best').textContent = best;
        AGA.save('best', best);
        AGA.setTitle(`새 앱 (최고 ${best}점)`);
      }
      moveDot();
    });
    $('restart').addEventListener('click', reset);
    $('quit').addEventListener('click', () => AGA.close());

    // ---------- 그리기 ----------
    function draw() {
      ctx.fillStyle = '#3b4a5e';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8b84a';
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f7f3e8';
      ctx.font = '16px Galmuri11, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('노란 점을 눌러 보세요', W / 2, H - 18);
    }
    function loop() {
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
