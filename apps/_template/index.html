<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 앱</title>
  <!--
    새 앱의 틀. 이 폴더를 통째로 복사해서 apps/<내 앱 id>/ 로 이름을 바꾸고 시작한다(id는 영어 소문자와 하이픈).
    _ 로 시작하는 폴더는 틀이라 화면에 나오지 않는다. 자세한 설명은 apps/README.md.
    이 틀은 "점을 누르면 점수가 오르는" 아주 작은 게임이다. 시작 카드, 그리기, 입력, 기록 저장, 창 닫기가 다 들어 있으니 필요한 부분만 바꾼다.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    /* 스크롤바가 생겼다 사라지며 화면이 떨리는 일을 막는다(known-issues 14). 지우지 않는다. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #2f3a4a;
      font-family: "Galmuri11", system-ui, sans-serif;
      color: #f7f3e8;
      user-select: none;
    }
    /* 머리줄은 한 줄을 지킨다(두 줄이 되면 아래 게임판이 밀린다, known-issues 12). */
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; white-space: nowrap; overflow: hidden; background: #222b38; font-size: 14px; }
    header .grow { flex: 1; }
    /* 손가락 커서는 아가라고요 창 안에서는 그 시절 모양, 혼자 열면 기본 pointer 가 나온다. */
    button { font: inherit; font-size: 13px; padding: 4px 10px; cursor: var(--aga-hand, pointer); }
    #wrap { flex: 1; display: grid; place-items: center; min-height: 0; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <span>점수 <b id="score">0</b></span>
    <span>최고 <b id="best">0</b></span>
    <span class="grow"></span>
    <button id="help">게임 방법</button>
    <button id="restart">다시</button>
    <button id="quit">끝내기</button>
  </header>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <script src="../aga-sdk.js"></script>
  <script>
    // ---------- 게임판 ----------
    // 그리기는 늘 W×H 게임 단위로 한다. 창 크기가 바뀌어도 SDK가 맞춰 준다.
    const W = 480;
    const H = 360;
    const $ = id => document.getElementById(id);
    const cv = $('cv');
    const ctx = cv.getContext('2d');
    const board = AGA.fitCanvas(cv, $('wrap'), W, H);

    // ---------- 기록 ----------
    // AGA.save('best', 값) 은 localStorage 'my-app.best' 처럼 내 앱 id를 앞에 붙여 저장한다.
    let best = AGA.load('best', 0);
    $('best').textContent = best;

    // ---------- 상태 ----------
    let score, dot;
    function reset() {
      score = 0;
      $('score').textContent = score;
      moveDot();
    }
    function moveDot() {
      dot = { x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80), r: 22 };
    }

    // ---------- 입력 ----------
    cv.addEventListener('pointerdown', e => {
      const p = board.point(e); // 마우스 위치를 게임 단위로
      if (Math.hypot(p.x - dot.x, p.y - dot.y) > dot.r) return;
      score += 1;
      $('score').textContent = score;
      if (score > best) {
        best = score;
        $('best').textContent = best;
        AGA.save('best', best);
        AGA.setTitle(`새 앱 (최고 ${best}점)`);
      }
      moveDot();
    });
    $('restart').addEventListener('click', reset);
    $('quit').addEventListener('click', () => AGA.close());
    $('help').addEventListener('click', () => { if (!card.isOpen) openCard(true); });

    // ---------- 시작 카드 ----------
    // 창을 열면 판 위에 게임 이름, 조작 안내 한 문장, 되풀이되는 시범 그림, 최고 기록, 시작 단추를 띄운다.
    // 카드가 떠 있는 동안(card.isOpen) 시계와 움직임을 멈춘다. 판 위 클릭은 카드가 막아 준다.
    const card = AGA.gameCard(cv, {
      title: '새 앱',
      how: '노란 점을 눌러 보세요.',
      demo: {
        width: 200, height: 80, period: 1600,
        draw(g, t) { // t는 0..period(ms). 점이 한 번 눌려 작아졌다 돌아온다
          g.fillStyle = '#3b4a5e';
          g.fillRect(0, 0, 200, 80);
          g.fillStyle = '#e8b84a';
          g.beginPath();
          g.arc(100, 40, t > 600 && t < 800 ? 14 : 20, 0, Math.PI * 2);
          g.fill();
        },
      },
      width: 300,
      colors: { bg: '#f7f3e8', fg: '#222b38', accent: '#e8b84a', line: '#222b38', onAccent: '#222b38' },
    });
    // midGame: 게임 방법 단추로 다시 연 카드는 하던 판을 이어서 한다(Esc도 같다)
    function openCard(midGame) {
      card.open({
        note: `최고 ${best}점`,
        rows: [{ buttons: [{ text: midGame ? '이어서 하기' : '게임 시작', main: true, onClick() {} }] }],
        onEscape: midGame ? () => {} : null,
      });
    }

    // ---------- 창을 최소화했을 때 ----------
    // 창을 최소화하면 AGA.onHide에 넣은 함수가, 작업 표시줄에서 다시 띄우면 AGA.onShow에 넣은 함수가 불린다
    // (지금은 실험실의 "최소화하면 게임 멈추기"를 켠 브라우저에서만). 시계나 저절로 움직이는 것이 있는 게임은
    // 시작 카드가 떠 있을 때처럼 가려진 동안에도 멈춘다. 이 틀의 게임은 누를 때만 바뀌어서 멈출 것이 없다.
    //   let hidden = false;
    //   AGA.onHide(() => { hidden = true; });
    //   AGA.onShow(() => { hidden = false; });
    //   loop 안에서: if (!card.isOpen && !hidden) { 시계와 움직임 }

    // ---------- 그리기 ----------
    function draw() {
      ctx.fillStyle = '#3b4a5e';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8b84a';
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f7f3e8';
      ctx.font = '16px Galmuri11, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('노란 점을 눌러 보세요', W / 2, H - 18);
    }
    function loop() {
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    openCard(false);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
