<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파일 정리 10</title>
  <!-- 파일 정리 10: 바탕화면처럼 끌어서 네모로 파일을 고르고, 숫자 합이 10이면 지운다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    /* 스크롤바가 생기면 폭이 줄어 캔버스를 다시 맞추고, 그러면 스크롤바가 사라지는 일이 끝없이 반복된다. 아예 막는다. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #2f6f6b;
      font-family: "Galmuri11", system-ui, sans-serif;
      color: #fff;
      user-select: none;
    }
    /* 점수나 다음 물건 이름이 길어져도 한 줄을 지킨다(두 줄이 되면 아래 게임판이 밀린다). */
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; white-space: nowrap; overflow: hidden; background: #1f4d4a; font-size: 14px; }
    header > * { flex: none; }
    header .grow { flex: 1; }
    #timebar { width: 160px; height: 10px; border: 2px solid #fff; }
    #timebar i { display: block; height: 100%; background: #f6cf6a; }
    button { font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
    #wrap { flex: 1; display: grid; place-items: center; min-height: 0; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <span>지운 파일 <b id="score">0</b></span>
    <span>최고 <b id="best">0</b></span>
    <span class="grow"></span>
    <span id="timebar"><i></i></span>
    <button id="restart">다시</button>
    <button id="quit">끝내기</button>
  </header>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <script src="../aga-sdk.js"></script>
  <script>
    const COLS = 15;
    const ROWS = 9;
    const CELL = 44;
    const PAD = 10;
    const W = COLS * CELL + PAD * 2;
    const H = ROWS * CELL + PAD * 2;
    const TIME = 100; // 초
    // 숫자마다 파일 색 (1~9)
    const COLORS = ['', '#f6cf6a', '#e8a33d', '#e07a5f', '#c56c96', '#8b7fd6', '#5b8def', '#6fae8f', '#9fd36a', '#d8c3a0'];

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const $ = id => document.getElementById(id);
    const BEST_KEY = 'file-ten.best';
    let best = +(localStorage.getItem(BEST_KEY) || 0);
    $('best').textContent = best;

    let grid, score, left, started, sel, over, flash;

    function reset() {
      grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => 1 + Math.floor(Math.random() * 9)));
      score = 0;
      left = TIME;
      started = performance.now();
      sel = null;
      over = false;
      flash = [];
      $('score').textContent = 0;
    }

    // ---------- 화면 크기 ----------
    let scale = 1;
    let lastSize = '';
    function fit() {
      const wrap = $('wrap');
      // 크기가 그대로면 다시 맞추지 않는다(소수점 차이로 계속 다시 맞추는 일을 막는다).
      const size = `${wrap.clientWidth}x${wrap.clientHeight}`;
      if (size === lastSize) return;
      lastSize = size;
      scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      const dpr = window.devicePixelRatio || 1;
      const cssW = Math.floor(W * scale);
      const cssH = Math.floor(H * scale);
      cv.style.width = cssW + 'px';
      cv.style.height = cssH + 'px';
      cv.width = Math.round(cssW * dpr);
      cv.height = Math.round(cssH * dpr);
      ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    }
    // 게임판 자리의 크기가 바뀔 때마다(창 크기, 머리줄 높이) 다시 맞춘다.
    new ResizeObserver(fit).observe($('wrap'));

    // ---------- 고르기 ----------
    const toGame = e => {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
    };

    // 네모 안에 가운데가 들어온 파일들
    function picked() {
      if (!sel) return [];
      const x0 = Math.min(sel.x0, sel.x1);
      const x1 = Math.max(sel.x0, sel.x1);
      const y0 = Math.min(sel.y0, sel.y1);
      const y1 = Math.max(sel.y0, sel.y1);
      const out = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c]) continue;
          const cx = PAD + c * CELL + CELL / 2;
          const cy = PAD + r * CELL + CELL / 2;
          if (cx > x0 && cx < x1 && cy > y0 && cy < y1) out.push([r, c]);
        }
      }
      return out;
    }
    const sumOf = cells => cells.reduce((s, [r, c]) => s + grid[r][c], 0);

    cv.addEventListener('pointerdown', e => {
      if (over) { reset(); return; }
      const p = toGame(e);
      sel = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    });
    window.addEventListener('pointermove', e => {
      if (!sel) return;
      const p = toGame(e);
      sel.x1 = p.x;
      sel.y1 = p.y;
    });
    window.addEventListener('pointerup', () => {
      if (!sel) return;
      const cells = picked();
      if (cells.length && sumOf(cells) === 10) {
        for (const [r, c] of cells) {
          flash.push({ r, c, v: grid[r][c], t: performance.now() });
          grid[r][c] = 0;
        }
        score += cells.length;
        $('score').textContent = score;
        if (score > best) {
          best = score;
          $('best').textContent = best;
          localStorage.setItem(BEST_KEY, best);
        }
      }
      sel = null;
    });
    $('restart').addEventListener('click', reset);
    $('quit').addEventListener('click', () => AGA.close());

    // ---------- 그리기 ----------
    function drawFile(x, y, v, alpha = 1) {
      ctx.globalAlpha = alpha;
      const w = CELL - 10;
      const h = CELL - 6;
      const fold = 9;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w - fold, y);
      ctx.lineTo(x + w, y + fold);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      ctx.fillStyle = '#fbf8ef';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#1f2b2a';
      ctx.stroke();
      ctx.fillStyle = COLORS[v];
      ctx.fillRect(x + 4, y + h - 12, w - 8, 8);
      ctx.fillStyle = '#1f2b2a';
      ctx.font = '18px Galmuri11, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, x + w / 2, y + h / 2 - 3);
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.fillStyle = '#3a807b';
      ctx.fillRect(0, 0, W, H);
      const chosen = new Set(picked().map(([r, c]) => r * COLS + c));
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = PAD + c * CELL + 5;
          const y = PAD + r * CELL + 3;
          if (chosen.has(r * COLS + c)) {
            ctx.fillStyle = '#ffffff40';
            ctx.fillRect(x - 3, y - 2, CELL - 4, CELL - 2);
          }
          if (grid[r][c]) drawFile(x, y, grid[r][c]);
        }
      }
      // 지워지는 파일: 위로 떠오르며 흐려진다
      const now = performance.now();
      flash = flash.filter(f => now - f.t < 400);
      for (const f of flash) {
        const k = (now - f.t) / 400;
        drawFile(PAD + f.c * CELL + 5, PAD + f.r * CELL + 3 - k * 14, f.v, 1 - k);
      }
      if (sel) {
        const x = Math.min(sel.x0, sel.x1);
        const y = Math.min(sel.y0, sel.y1);
        const w = Math.abs(sel.x1 - sel.x0);
        const h = Math.abs(sel.y1 - sel.y0);
        const s = sumOf(picked());
        ctx.fillStyle = s === 10 ? '#f6cf6a40' : '#5b8def33';
        ctx.fillRect(x, y, w, h);
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = s === 10 ? '#f6cf6a' : '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.setLineDash([]);
        ctx.fillStyle = s === 10 ? '#f6cf6a' : s > 10 ? '#ff8a80' : '#ffffff';
        ctx.font = '16px Galmuri11, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`합 ${s}`, sel.x1 + 10, sel.y1 + 14);
      }
      if (over) {
        ctx.fillStyle = '#000a';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '28px Galmuri11, sans-serif';
        ctx.fillText(`파일 ${score}개를 정리했어요`, W / 2, H / 2 - 18);
        ctx.font = '18px Galmuri11, sans-serif';
        ctx.fillText('누르면 다시 시작', W / 2, H / 2 + 20);
      }
    }

    function loop(now) {
      if (!over) {
        left = Math.max(0, TIME - (now - started) / 1000);
        if (left === 0) {
          over = true;
          sel = null;
          AGA.setTitle(`파일 정리 10 (최고 ${best}개)`);
        }
      }
      $('timebar').firstElementChild.style.width = (left / TIME) * 100 + '%';
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    fit();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
