<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>짐 정리</title>
  <!-- 짐 정리: 이삿짐 상자에 물건을 떨어뜨리고, 같은 물건 두 개가 닿으면 한 단계 큰 물건이 된다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <style>
    /* 스크롤바가 생기면 폭이 줄어 캔버스를 다시 맞추고, 그러면 스크롤바가 사라지는 일이 끝없이 반복된다. 아예 막는다. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #3b2f2a;
      font-family: "Galmuri11", system-ui, sans-serif;
      color: #fdf6e3;
      user-select: none;
    }
    /* 점수나 다음 물건 이름이 길어져도 한 줄을 지킨다(두 줄이 되면 아래 게임판이 밀린다). */
    header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; white-space: nowrap; overflow: hidden; background: #2a211d; font-size: 14px; }
    header > * { flex: none; }
    header .grow { flex: 1; }
    button { font: inherit; font-size: 13px; padding: 4px 10px; cursor: var(--aga-hand, pointer); }
    #wrap { flex: 1; display: grid; place-items: center; min-height: 0; }
    canvas { display: block; touch-action: none; cursor: crosshair; }
    /* 시작 카드의 물건 순서 한 줄 */
    .tiers { display: grid; gap: 4px; width: 100%; font-size: 11px; }
    .tiers-dots { display: flex; align-items: center; justify-content: space-between; }
    .tiers-dots i { flex: none; box-sizing: border-box; border: 2px solid #2a211d; border-radius: 50%; }
    .tiers-ends { display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <span>점수 <b id="score">0</b></span>
    <span>최고 <b id="best">0</b></span>
    <span class="grow"></span>
    <span>다음 <b id="next" style="display:inline-block; min-width: 3.2em"></b></span>
    <button id="help">게임 방법</button>
    <button id="restart">다시</button>
    <button id="quit">끝내기</button>
  </header>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <script src="../aga-sdk.js"></script>
  <script>
    // ---------- 물건 단계 ----------
    // 같은 단계 두 개가 닿으면 다음 단계가 된다. 옷장 두 개가 만나면 큰 보너스를 받고 사라진다.
    const TIERS = [
      { name: '단추', r: 14, c: '#e07a5f' },
      { name: '지우개', r: 19, c: '#f2cc8f' },
      { name: '머그컵', r: 25, c: '#81b29a' },
      { name: '책', r: 32, c: '#5b8def' },
      { name: '화분', r: 40, c: '#6fae6a' },
      { name: '라디오', r: 49, c: '#b5838d' },
      { name: '의자', r: 59, c: '#c9a227' },
      { name: '책상', r: 70, c: '#b08354' },
      { name: '소파', r: 82, c: '#c9766a' },
      { name: '침대', r: 96, c: '#8fa9d6' },
      { name: '옷장', r: 112, c: '#d8c3a0' },
    ];
    const W = 400;          // 상자 안쪽 가로 (게임 단위)
    const H = 560;          // 상자 안쪽 세로
    const LINE = 92;        // 이 줄 위로 물건이 쌓여 1.2초를 넘기면 끝
    const GRAVITY = 1500;
    const DROP_GAP = 450;   // 떨어뜨린 뒤 다음 물건까지 (ms)

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const $ = id => document.getElementById(id);
    let best = AGA.load('best', 0); // localStorage 'tidy-up.best'
    $('best').textContent = best;

    let bodies, score, aimX, current, nextTier, lastDrop, overTimer, over;
    // 첫 판 안내: 처음 하는 사람에게만 단추를 주고 떨어뜨리기와 합치기를 한 번씩 짚어 준다.
    // 'drop'(떨어뜨려 보기) → 'merge'(단추 위에 떨어뜨려 합치기) → null. 끝내거나 건너뛰면 'tidy-up.tutored'에 남긴다
    let tutor = null;
    let tipUntil = 0; // 합친 뒤 "지우개가 됐어요!"를 보여 주는 끝 시각

    function randTier() {
      const r = Math.random();
      return r < 0.35 ? 0 : r < 0.62 ? 1 : r < 0.82 ? 2 : r < 0.95 ? 3 : 4;
    }

    function reset() {
      bodies = [];
      score = 0;
      aimX = W / 2;
      tutor = AGA.load('tutored', false) ? null : 'drop';
      current = tutor ? 0 : randTier();
      nextTier = tutor ? 0 : randTier();
      lastDrop = 0;
      overTimer = 0;
      over = false;
      tipUntil = 0;
      $('score').textContent = 0;
      $('next').textContent = TIERS[nextTier].name;
      showTip();
    }

    // ---------- 첫 판 안내 ----------
    // 안내 한 줄은 카드가 떠 있는 동안 숨긴다
    function showTip() {
      if (card.isOpen) card.tip(null);
      else if (tutor === 'drop') card.tip('눌러서 떨어뜨려 보세요', { at: 0.3, onSkip: endTutor });
      else if (tutor === 'merge') card.tip('단추 위에 떨어뜨려요', { at: 0.3, onSkip: endTutor });
      else if (tipUntil) card.tip('지우개가 됐어요!', { at: 0.3, onSkip: () => { tipUntil = 0; } });
      else card.tip(null);
    }
    function endTutor() {
      tutor = null;
      AGA.save('tutored', true);
      nextTier = randTier();
      $('next').textContent = TIERS[nextTier].name;
      showTip();
    }

    // ---------- 화면 크기 ----------
    // 게임판 자리의 크기가 바뀔 때마다(창 크기, 머리줄 높이) SDK가 다시 맞춘다. 그리기는 늘 W×H 단위다.
    const board = AGA.fitCanvas(cv, $('wrap'), W, H);

    // ---------- 입력 ----------
    const toGame = e => board.point(e).x;
    cv.addEventListener('pointermove', e => { aimX = toGame(e); });
    cv.addEventListener('pointerdown', e => {
      aimX = toGame(e);
      if (over) { reset(); return; }
      const now = performance.now();
      if (now - lastDrop < DROP_GAP) return;
      const r = TIERS[current].r;
      // 같은 자리에 정확히 떨어뜨리면 공이 탑처럼 균형을 잡고 서 버리므로 아주 조금 흔든다.
      const x = Math.max(r, Math.min(W - r, aimX + (Math.random() - 0.5) * 2));
      bodies.push({ x, y: LINE - r - 6, vx: 0, vy: 0, t: current, r, born: now });
      lastDrop = now;
      current = nextTier;
      nextTier = tutor ? 0 : randTier(); // 안내 중에는 합칠 때까지 단추만 준다
      $('next').textContent = TIERS[nextTier].name;
      if (tutor === 'drop') {
        tutor = 'merge';
        showTip();
      }
    });
    $('restart').addEventListener('click', reset);
    $('help').addEventListener('click', () => { if (!card.isOpen) openCard(true); });
    $('quit').addEventListener('click', () => AGA.close());

    // ---------- 물리 ----------
    function step(dt) {
      for (const b of bodies) {
        b.vy += GRAVITY * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.x < b.r) { b.x = b.r; b.vx *= -0.3; }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -0.3; }
        if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -0.2; b.vx *= 0.98; }
      }
      const merged = new Set();
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i];
          const b = bodies[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.001;
          const overlap = a.r + b.r - d;
          if (overlap <= 0) continue;
          if (a.t === b.t && !merged.has(a) && !merged.has(b)) {
            merged.add(a);
            merged.add(b);
            continue;
          }
          // 겹친 만큼 질량(넓이) 비율로 밀어내고, 마주 오는 속도를 줄인다.
          const nx = dx / d;
          const ny = dy / d;
          const ma = a.r * a.r;
          const mb = b.r * b.r;
          const pa = mb / (ma + mb);
          const pb = ma / (ma + mb);
          a.x -= nx * overlap * pa;
          a.y -= ny * overlap * pa;
          b.x += nx * overlap * pb;
          b.y += ny * overlap * pb;
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) {
            const j2 = -rel * 1.2;
            a.vx -= nx * j2 * pa;
            a.vy -= ny * j2 * pa;
            b.vx += nx * j2 * pb;
            b.vy += ny * j2 * pb;
          }
        }
      }
      if (merged.size) mergePairs(merged);
    }

    function mergePairs(set) {
      const list = [...set];
      const used = new Set();
      for (const a of list) {
        if (used.has(a)) continue;
        const b = list.find(o => o !== a && !used.has(o) && o.t === a.t && Math.hypot(o.x - a.x, o.y - a.y) <= o.r + a.r + 0.5);
        if (!b) continue;
        used.add(a);
        used.add(b);
        bodies = bodies.filter(o => o !== a && o !== b);
        const t = a.t + 1;
        if (t >= TIERS.length) {
          score += 500; // 옷장 두 개: 방이 깔끔해졌다
        } else {
          const r = TIERS[t].r;
          bodies.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, vx: 0, vy: -120, t, r, born: performance.now() });
          score += (t + 1) * (t + 2) / 2;
        }
        if (tutor === 'merge') {
          endTutor();
          tipUntil = performance.now() + 1500;
          showTip();
        }
      }
      $('score').textContent = score;
      if (score > best) {
        best = score;
        $('best').textContent = best;
        AGA.save('best', best);
      }
    }

    function checkOver(dt) {
      const now = performance.now();
      const high = bodies.some(b => now - b.born > 900 && b.y - b.r < LINE);
      overTimer = high ? overTimer + dt : 0;
      if (overTimer > 1.2) {
        over = true;
        AGA.setTitle(`짐 정리 (최고 ${best}점)`);
      }
    }

    // ---------- 그리기 ----------
    // g: 그릴 캔버스(시작 카드의 시범 그림도 같은 함수로 그린다), scale: 합쳐질 때 부풀리는 배율
    function drawBody(x, y, t, alpha = 1, g = ctx, scale = 1) {
      const tier = TIERS[t];
      const r = tier.r * scale;
      g.globalAlpha = alpha;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fillStyle = tier.c;
      g.fill();
      g.lineWidth = 3;
      g.strokeStyle = '#2a211d';
      g.stroke();
      g.beginPath();
      g.arc(x - r * 0.3, y - r * 0.35, r * 0.25, 0, Math.PI * 2);
      g.fillStyle = '#ffffff55';
      g.fill();
      g.fillStyle = '#2a211d';
      g.font = `${Math.max(10, Math.min(18, tier.r * 0.5))}px Galmuri11, sans-serif`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(tier.name, x, y + 1);
      g.globalAlpha = 1;
    }

    // 안내 중에 바닥에 놓인 단추 위로 오르내리는 화살표(여기에 떨어뜨리면 합쳐진다)
    function drawPointer() {
      const b = bodies.filter(o => o.t === 0).sort((p, q) => q.y - p.y)[0];
      if (!b) return;
      const y = b.y - b.r - 8 - Math.abs(Math.sin(performance.now() / 220)) * 10;
      ctx.fillStyle = '#c5483f';
      ctx.beginPath();
      ctx.moveTo(b.x, y);
      ctx.lineTo(b.x - 9, y - 12);
      ctx.lineTo(b.x + 9, y - 12);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      // 상자 안쪽 (골판지)
      ctx.fillStyle = '#d8b07a';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#cfa56d';
      for (let y = 0; y < H; y += 8) ctx.fillRect(0, y, W, 3);
      // 넘치면 안 되는 줄
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = overTimer > 0 ? '#c5483f' : '#7a5530';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, LINE);
      ctx.lineTo(W, LINE);
      ctx.stroke();
      ctx.setLineDash([]);
      for (const b of bodies) drawBody(b.x, b.y, b.t);
      if (tutor === 'merge' && !card.isOpen) drawPointer();
      if (!over) {
        const r = TIERS[current].r;
        const x = Math.max(r, Math.min(W - r, aimX));
        ctx.strokeStyle = '#7a553066';
        ctx.beginPath();
        ctx.moveTo(x, LINE - r - 6);
        ctx.lineTo(x, H);
        ctx.stroke();
        drawBody(x, LINE - r - 6, current, performance.now() - lastDrop < DROP_GAP ? 0.4 : 1);
      } else {
        ctx.fillStyle = '#000a';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fdf6e3';
        ctx.textAlign = 'center';
        ctx.font = '28px Galmuri11, sans-serif';
        ctx.fillText('상자가 꽉 찼어요', W / 2, H / 2 - 24);
        ctx.font = '18px Galmuri11, sans-serif';
        ctx.fillText(`${score}점, 누르면 다시 시작`, W / 2, H / 2 + 16);
      }
    }

    // ---------- 창을 최소화했을 때 ----------
    // 실험실의 "최소화하면 게임 멈추기"를 켜면 창을 최소화할 때 알림이 온다(AGA.onHide, AGA.onShow).
    // 가려진 동안은 떨어지던 물건이 그 자리에 멈추고, 다시 띄우면 바로 이어진다. 시계가 없는 게임이라 카드로 기다리게 하지 않는다
    let hidden = false;
    AGA.onHide(() => { hidden = true; });
    AGA.onShow(() => { hidden = false; });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      // 시작 카드가 떠 있거나 창이 가려진 동안은 물건이 멈춘다
      if (!over && !card.isOpen && !hidden) {
        for (let i = 0; i < 4; i++) step(dt / 4);
        checkOver(dt);
      }
      if (tipUntil && now > tipUntil) {
        tipUntil = 0;
        showTip();
      }
      draw();
      requestAnimationFrame(loop);
    }

    // ---------- 시작 카드 ----------
    // 시범 그림: 단추 하나가 떨어져 바닥의 단추에 닿으면 지우개가 된다. 2.6초마다 되풀이한다
    function drawDemo(g, t) {
      const floor = 96;
      g.fillStyle = '#d8b07a';
      g.fillRect(0, 0, 240, 100);
      const ax = 104;
      const ay = floor - 14;
      const bx = 128;
      const hit = ay - Math.sqrt(28 * 28 - 24 * 24); // 두 단추가 닿는 높이
      if (t < 1000) {
        const k = t < 400 ? 0 : Math.min(1, (t - 400) / 500) ** 2;
        const by = 18 + (hit - 18) * k;
        if (t < 400) {
          g.strokeStyle = '#7a553066';
          g.lineWidth = 2;
          g.beginPath();
          g.moveTo(bx, by);
          g.lineTo(bx, floor);
          g.stroke();
        }
        drawBody(ax, ay, 0, 1, g);
        drawBody(bx, by, 0, 1, g);
      } else {
        const k = Math.min(1, (t - 1000) / 200);
        const pop = 1 + 0.25 * Math.sin(k * Math.PI);
        const fade = t > 2200 ? 1 - (t - 2200) / 400 : 1;
        drawBody((ax + bx) / 2, floor - 19, 1, Math.max(0, fade), g, pop);
      }
    }

    // 물건 순서 한 줄: 단추부터 옷장까지 작은 동그라미 11개
    const tiers = document.createElement('div');
    tiers.className = 'tiers';
    const dots = document.createElement('div');
    dots.className = 'tiers-dots';
    TIERS.forEach((tier, i) => {
      const d = document.createElement('i');
      const size = Math.round(8 + i * 1.3);
      Object.assign(d.style, { width: size + 'px', height: size + 'px', background: tier.c });
      d.title = tier.name;
      dots.append(d);
    });
    const ends = document.createElement('div');
    ends.className = 'tiers-ends';
    ends.innerHTML = '<span>단추</span><span>합칠수록 커져요</span><span>옷장</span>';
    tiers.append(dots, ends);

    const card = AGA.gameCard(cv, {
      title: '짐 정리',
      how: '같은 물건끼리 닿게 떨어뜨려 보세요.', // 줄이 바뀌어도 "떨어뜨려 보세요"는 붙여 둔다
      demo: { width: 240, height: 100, period: 2600, draw: drawDemo },
      extra: tiers,
      width: 300,
      colors: { bg: '#fdf6e3', fg: '#2a211d', accent: '#e07a5f', line: '#2a211d', onAccent: '#fff' },
      onOpen: () => showTip(),
      onClose: () => showTip(),
    });
    // midGame: 게임 방법 단추로 다시 연 카드는 하던 판을 이어서 한다(Esc도 같다)
    function openCard(midGame) {
      card.open({
        note: `최고 ${best}점`,
        rows: [{ buttons: [{ text: midGame ? '이어서 하기' : '게임 시작', main: true, onClick() {} }] }],
        onEscape: midGame ? () => {} : null,
      });
    }

    reset();
    openCard(false);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
