<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아가라고요</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- 아래 import map, 미리 받을 모듈 줄, ?v= 지문은 배포할 때 tools/stamp.py 가 채운다. 손으로 고치지 않는다(known-issues 15). -->
  <script type="importmap">
{
  "imports": {
    "./data/apps.js": "./data/apps.js?v=1c5d9c65",
    "./data/furniture.js": "./data/furniture.js?v=e5b1d42b",
    "./src/apps/room-app.js": "./src/apps/room-app.js?v=ec7f7c8b",
    "./src/config.js": "./src/config.js?v=b2faa2b0",
    "./src/crt.js": "./src/crt.js?v=98658a6d",
    "./src/icons.js": "./src/icons.js?v=3566a45c",
    "./src/iso.js": "./src/iso.js?v=d8dfb6d7",
    "./src/os.js": "./src/os.js?v=d8eb882e",
    "./src/room.js": "./src/room.js?v=c6b93a54",
    "./src/rules.js": "./src/rules.js?v=f2050583",
    "./src/share.js": "./src/share.js?v=1d6e579a",
    "./src/shelf.js": "./src/shelf.js?v=70dc9ee0",
    "./src/win.js": "./src/win.js?v=73db6fa7"
  }
}
  </script>
  <!-- 모듈 미리 받기: main.js가 import로 부르는 모듈을 HTML을 읽자마자 한꺼번에 받는다. 크롬 계열에서만 template 안의 줄을 꺼내 붙인다.
       사파리(WebKit)는 미리 받다 실패한 모듈을 새로 고침해도 다시 받지 않아 가림막이 걷히지 않는다(known-issues 43).
       스타일시트보다 앞에 둔다. 뒤에 두면 아래 스크립트가 CSS를 다 받을 때까지 기다린다. -->
  <template id="modulepreload"></template>
  <script>
    // 크롬 계열 판별은 src/main.js의 CHROMIUM과 같은 식이다. 한쪽을 고치면 다른 쪽도 같이 고친다.
    if (/Chrome\/|Chromium\//.test(navigator.userAgent)) document.head.append(document.getElementById('modulepreload').content);
  </script>
  <!-- 글꼴: 첫 화면은 사이트 글자만 담은 작은 글꼴(AgaUI, 두 벌 합쳐 약 21KB)로 그리므로 HTML을 읽자마자 받는다.
       주소는 style.css의 @font-face와 글자까지 같아야 한 번만 받는다(tools/check.py가 본다). 갈무리11 전체는 가림막이 걷힌 뒤
       main.js가 jsdelivr에서 이어 받으므로, 그때 연결을 새로 맺지 않게 미리 이어 둔다(known-issues 45). -->
  <link rel="preload" href="assets/fonts/aga-ui.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/aga-ui-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css?v=4f320ec8">
</head>
<body data-era="2005">
  <!-- 첫 화면 가림막. main.js가 모니터를 다 그리고 글꼴을 받을 때까지 화면 전체를 덮는다(style.css의 "첫 화면 가림막", known-issues 42).
       새로 고침 단추는 모듈을 받지 못했을 때도 눌려야 하므로 main.js가 아니라 여기서 바로 잇는다. -->
  <div class="page-loader" id="page-loader">
    <p class="page-loader-dots" role="status"><i></i><i></i><i></i><span>불러오는 중</span></p>
    <p class="page-loader-slow"><span>불러오는 데 오래 걸리고 있습니다.</span><button type="button" onclick="location.reload()">새로 고침</button></p>
  </div>
  <div class="viewport" id="viewport">
  <div class="monitor">
    <div class="bezel">
      <div class="screen" id="screen">
        <!-- 화면 안쪽(무대와 전원 연출). 그레인과 깜빡임은 이 바깥에서 화면 전체에 겹친다. -->
        <div class="crt" id="crt">
        <div class="stage" id="stage">
          <!-- 바탕화면 (1280×800): 배경은 지금 꾸민 방 그림이다 -->
          <div class="desktop" id="desktop" hidden>
            <div class="wallpaper" id="wallpaper"></div>
            <div class="icons" id="icons"></div>
            <div class="windows" id="windows"></div>
          </div>
          <div class="taskbar" id="taskbar" hidden>
            <button type="button" class="start-btn"><span class="start-logo"></span>시작</button>
            <div class="tasks" id="tasks"></div>
            <span class="clock"></span>
          </div>
          <div class="start-menu" id="start-menu" hidden></div>

          <div class="boot" id="boot" hidden>
            <div class="boot-logo" hidden>
              <div class="boot-title">아가라고요</div>
              <div class="boot-bar"><i></i></div>
            </div>
          </div>

          <div class="login" id="login" hidden>
            <div class="login-top"></div>
            <div class="login-mid">
              <div class="login-left">
                <div class="login-logo">아가라고요</div>
                <p>시작하려면 사용자 이름을 누르세요.</p>
              </div>
              <div class="users"></div>
            </div>
            <div class="login-bottom">
              <span>내 방을 꾸미고, 링크로 친구를 초대하는 컴퓨터</span>
            </div>
            <div class="welcome"></div>
          </div>

          <div class="toast" id="toast" role="status"></div>
        </div>

        <div class="fx fx-scan"></div>
        <div class="power-fx off" id="power-fx">
          <div class="beam"></div>
          <p class="power-hint">오른쪽 아래 전원 버튼을 눌러 주세요</p>
        </div>
        </div>
        <div class="fx fx-grain" id="grain"></div>
        <div class="fx fx-flicker"></div>
      </div>

      <div class="controls">
        <span class="brand">아가라고요</span>
        <span class="model">AGA-15</span>
        <span class="grille" aria-hidden="true"></span>
        <!-- 소리는 전원을 켜기 전에도 보이게 둔다(불이 켜져 있으면 전원을 누를 때부터 소리가 난다) -->
        <button type="button" class="phys sound-key" id="sound-key" aria-pressed="true" title="효과음과 배경음악을 켜고 끕니다"><i class="led"></i>소리</button>
        <button type="button" class="phys power" id="power" aria-pressed="false"><i class="led"></i>전원</button>
      </div>
    </div>
  </div>
  </div>

  <script type="module" src="src/main.js?v=610b612f"></script>
</body>
</html>
