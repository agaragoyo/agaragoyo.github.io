<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아가라고요</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="monitor">
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="stage" id="stage">
          <div class="room" id="room">
            <div class="items" id="items"></div>
          </div>

          <div class="shelf">
            <button type="button" class="shelf-arrow" aria-label="앞 가구">◀</button>
            <div class="shelf-track"></div>
            <button type="button" class="shelf-arrow" aria-label="뒤 가구">▶</button>
            <p class="shelf-visit">친구 방의 가구는 옮길 수 없습니다. 가구를 눌러 구경해 보세요.</p>
          </div>

          <div class="hud">
            <span class="owner" id="owner"></span>
            <button type="button" class="btn edit-only" id="btn-share">공유 링크</button>
            <button type="button" class="btn visit-only" id="btn-mine">나도 만들기</button>
          </div>

          <div class="windows" id="windows"></div>
          <div class="toast" id="toast" role="status"></div>

          <div class="start" id="start" hidden>
            <form class="win start-win" id="start-form">
              <div class="win-bar"><span>아가라고요</span></div>
              <div class="win-body">
                <p>내 방을 가구로 꾸미고, 링크로 친구를 초대하는 곳입니다.</p>
                <label for="nickname">닉네임</label>
                <div class="share-row">
                  <input id="nickname" maxlength="12" autocomplete="off" placeholder="최대 12글자">
                  <button type="submit" class="btn">방 만들기</button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="fx fx-scan"></div>
        <div class="fx fx-grain"></div>
        <div class="fx fx-curve"></div>
        <div class="power-fx off" id="power-fx">
          <div class="beam"></div>
          <p class="power-hint">오른쪽 아래 전원 버튼을 눌러 주세요</p>
        </div>
      </div>

      <div class="controls">
        <span class="brand">아가라고요</span>
        <button type="button" class="phys" data-toggle="grain" aria-pressed="true"><i class="led"></i>그레인</button>
        <button type="button" class="phys" data-toggle="curve" aria-pressed="true"><i class="led"></i>볼록</button>
        <button type="button" class="phys power" id="power" aria-pressed="false"><i class="led"></i>전원</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
